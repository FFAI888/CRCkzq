<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PancakeSwap V2 交易对地址计算器（含链上验证）</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            padding: 32px;
            max-width: 640px;
            width: 100%;
            color: #e2e8f0;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 6px;
            color: #fbbf24;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 24px;
            font-size: 14px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #cbd5e1;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            box-sizing: border-box;
            color: #e2e8f0;
        }
        input:focus {
            outline: none;
            border-color: #fbbf24;
        }
        button {
            background: #fbbf24;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 700;
            margin-right: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background: #f59e0b;
        }
        .result {
            margin-top: 24px;
            padding: 18px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            word-break: break-all;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
        }
        .verified {
            border-color: #10b981;
            background: #022c22;
        }
        .mismatch {
            border-color: #ef4444;
            background: #2c0a0a;
        }
        .info {
            font-size: 12px;
            color: #64748b;
            margin-top: 16px;
        }
        .loading {
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥞 PancakeSwap V2 交易对地址计算器</h1>
        <p class="subtitle">自动计算 + 链上验证，确保和薄饼平台完全一致</p>

        <label for="tokenA">代币 A 合约地址</label>
        <input type="text" id="tokenA" placeholder="0x...">

        <label for="tokenB">代币 B 合约地址</label>
        <input type="text" id="tokenB" placeholder="0x...">

        <button onclick="calculatePair()">计算地址</button>
        <button onclick="verifyOnChain()">链上验证</button>

        <div id="result" class="result" style="display: none;"></div>

        <p class="info">
            Factory: <code>0xcA143Ce32Fe78f1f7019d7d551a6402fC5350c73</code><br>
            Init Code Hash: <code>0x00fb7f630766e6a796048ea87d01acd3068e8ff67d078148a3fa3f4a84f69bd5</code>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
    <script>
        const FACTORY = "0xcA143Ce32Fe78f1f7019d7d551a6402fC5350c73";
        const INIT_CODE_HASH = "0x00fb7f630766e6a796048ea87d01acd3068e8ff67d078148a3fa3f4a84f69bd5";

        // BSC 公共 RPC（也可以换成其他）
        const RPC_URL = "https://bsc-dataseed.binance.org/";

        function getTokenAddresses() {
            const tokenA = document.getElementById("tokenA").value.trim();
            const tokenB = document.getElementById("tokenB").value.trim();
            if (!ethers.isAddress(tokenA) || !ethers.isAddress(tokenB)) {
                throw new Error("请输入有效的合约地址（0x 开头，40位十六进制）");
            }
            const a = ethers.getAddress(tokenA);
            const b = ethers.getAddress(tokenB);
            // 自动排序
            const [token0, token1] = BigInt(a) < BigInt(b) ? [a, b] : [b, a];
            return { token0, token1 };
        }

        function computePairLocally(token0, token1) {
            const salt = ethers.keccak256(
                ethers.solidityPacked(["address", "address"], [token0, token1])
            );
            return ethers.getCreate2Address(FACTORY, salt, INIT_CODE_HASH);
        }

        function calculatePair() {
            const resultDiv = document.getElementById("result");
            resultDiv.style.display = "block";
            resultDiv.classList.remove("verified", "mismatch");
            resultDiv.innerHTML = "";

            try {
                const { token0, token1 } = getTokenAddresses();
                const pair = computePairLocally(token0, token1);

                resultDiv.innerHTML = `
                    <strong>token0：</strong> ${token0}<br>
                    <strong>token1：</strong> ${token1}<br><br>
                    <strong>本地计算结果：</strong><br>
                    <span style="color: #10b981;">${pair}</span>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<span style="color: #ef4444;">错误：${error.message}</span>`;
            }
        }

        async function verifyOnChain() {
            const resultDiv = document.getElementById("result");
            resultDiv.style.display = "block";
            resultDiv.classList.remove("verified", "mismatch");
            resultDiv.innerHTML = '<span class="loading">正在查询链上数据...</span>';

            try {
                const { token0, token1 } = getTokenAddresses();
                const localPair = computePairLocally(token0, token1);

                // 通过 RPC 调用 factory.getPair(token0, token1)
                const provider = new ethers.JsonRpcProvider(RPC_URL);
                const factoryAbi = [
                    "function getPair(address tokenA, address tokenB) external view returns (address pair)"
                ];
                const factoryContract = new ethers.Contract(FACTORY, factoryAbi, provider);
                const onChainPair = await factoryContract.getPair(token0, token1);

                if (onChainPair.toLowerCase() === localPair.toLowerCase()) {
                    resultDiv.classList.add("verified");
                    resultDiv.innerHTML = `
                        <strong>token0：</strong> ${token0}<br>
                        <strong>token1：</strong> ${token1}<br><br>
                        <strong>本地计算结果：</strong> ${localPair}<br>
                        <strong>链上实际结果：</strong> ${onChainPair}<br><br>
                        <span style="color: #10b981;">✅ 验证通过：计算结果和薄饼平台完全一致</span>
                    `;
                } else if (onChainPair === "0x0000000000000000000000000000000000000000") {
                    resultDiv.innerHTML = `
                        <strong>本地计算结果：</strong> ${localPair}<br><br>
                        <span style="color: #fbbf24;">⚠️ 链上尚未创建该交易对，但本地计算结果应为正确地址</span>
                    `;
                } else {
                    resultDiv.classList.add("mismatch");
                    resultDiv.innerHTML = `
                        <strong>本地计算结果：</strong> ${localPair}<br>
                        <strong>链上实际结果：</strong> ${onChainPair}<br><br>
                        <span style="color: #ef4444;">❌ 结果不一致！可能 init code hash 有误</span>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span style="color: #ef4444;">错误：${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
