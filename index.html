<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>稳定机制验证 · 零门槛 · 无API</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body {
            background: #0a0e17; color: #e2e8f0;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .card {
            background: #111827; border: 1px solid #1f2a3a;
            border-radius: 20px; padding: 28px; max-width: 650px; width: 100%;
        }
        h2 { color: #3b82f6; text-align: center; margin-bottom: 10px; }
        input, button {
            padding: 12px; border-radius: 12px; border: 1px solid #1f2a3a;
            background: #1e293b; color: #fff; font-size: 1rem; width: 100%; box-sizing: border-box;
            margin: 8px 0;
        }
        button {
            background: #3b82f6; font-weight: bold; cursor: pointer; border: none;
            transition: 0.2s;
        }
        button:hover { filter: brightness(1.2); }
        button.green { background: #10b981; }
        button.yellow { background: #f59e0b; }
        .flex-row { display: flex; gap: 10px; }
        .flex-row button { flex: 1; }
        .result {
            background: #0f172a; border-radius: 12px; padding: 16px;
            margin-top: 15px; font-size: 1rem;
        }
        .step {
            background: #1e293b; border-left: 4px solid #3b82f6;
            padding: 12px; margin: 10px 0; border-radius: 8px;
        }
        .copy-area {
            background: #000; color: #10b981; padding: 10px;
            border-radius: 8px; font-family: monospace; word-break: break-all;
        }
        hr { border-color: #1f2a3a; margin: 16px 0; }
    </style>
</head>
<body>
<div class="card">
    <h2>🛡️ 稳定机制验证器</h2>
    <p style="text-align:center; color:#94a3b8; font-size:0.85rem;">无需 API Key · 完全免费 · 100% 准确</p>

    <input type="text" id="contractAddress" placeholder="粘贴 PandaTokenV4 合约地址">

    <div class="flex-row">
        <button onclick="loadContract()">📦 加载合约</button>
        <button onclick="autoLoad()" class="green">⚡ 自动加载上次地址</button>
    </div>
    <div id="status" style="text-align:center; margin:8px 0;"></div>

    <div id="actions" style="display:none;">
        <div class="flex-row">
            <button onclick="openBscScanEvents()" class="yellow">🔍 跳转 BscScan 查看事件</button>
            <button onclick="copyEventNames()">📋 复制事件名</button>
        </div>
        <div class="step">
            👆 点击<strong>“跳转 BscScan”</strong>，在新打开的页面中按 <strong>Ctrl+V</strong> 粘贴搜索<br>
            看到 <code>StabilizeSellExecuted</code> 或 <code>StabilizeBuyExecuted</code> 即表示执行过
        </div>

        <button onclick="checkBalance()">💰 一键查询合约余额</button>
        <div id="balanceResult" class="result" style="display:none;"></div>
    </div>

    <hr>
    <div style="font-size:0.8rem; color:#94a3b8;">
        <b>📖 怎么判断？</b><br>
        • BscScan 页面搜到 <b>StabilizeSellExecuted</b> → ✅ 卖出已执行<br>
        • 搜到 <b>StabilizeBuyExecuted</b> → ✅ 回购已执行<br>
        • 如果一条都搜不到 → ❌ 稳定机制从未触发<br>
        • 余额查询：卖出执行后合约 USDT 会增加，回购执行后分发器代币会增加
    </div>
</div>

<script>
const RPC_URL = 'https://1rpc.io/bnb';
let provider = new ethers.providers.JsonRpcProvider(RPC_URL);
let contract = null;
let currentAddr = '';
let tokenDecimals = 18;
let currencyIsEth = false;
let currencyAddress = '';

const abi = [
    "function decimals() view returns (uint256)",
    "function currency() view returns (address)",
    "function currencyIsEth() view returns (bool)",
    "function balanceOf(address) view returns (uint256)",
    "function _LPRewardDistributor() view returns (address)"
];

async function loadContract() {
    const addr = document.getElementById('contractAddress').value.trim();
    if (!ethers.utils.isAddress(addr)) return alert('地址无效');
    currentAddr = addr;
    localStorage.setItem('verify_addr', addr);
    try {
        contract = new ethers.Contract(addr, abi, provider);
        const dec = await contract.decimals();
        tokenDecimals = Number(dec);
        currencyAddress = await contract.currency();
        currencyIsEth = await contract.currencyIsEth();
        document.getElementById('status').innerHTML = '<span style="color:#10b981;">✅ 合约已加载</span>';
        document.getElementById('actions').style.display = 'block';
    } catch (e) {
        document.getElementById('status').innerHTML = '<span style="color:#ef4444;">❌ 加载失败</span>';
    }
}

async function autoLoad() {
    const saved = localStorage.getItem('verify_addr');
    if (saved) {
        document.getElementById('contractAddress').value = saved;
        await loadContract();
    } else {
        alert('没有保存的地址');
    }
}

function openBscScanEvents() {
    if (!currentAddr) return alert('请先加载合约');
    const url = `https://bscscan.com/address/${currentAddr}#events`;
    window.open(url, '_blank');
    // 自动复制事件名到剪贴板
    copyEventNames();
    alert('已打开 BscScan 事件页面，并复制了事件名。\n在页面搜索框粘贴（Ctrl+V）即可搜索。');
}

function copyEventNames() {
    const text = 'StabilizeSellExecuted';
    navigator.clipboard.writeText(text).then(() => {
        // 提示已复制
    });
}

async function checkBalance() {
    if (!contract) return alert('请先加载合约');
    const resultDiv = document.getElementById('balanceResult');
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '⏳ 查询中...';
    try {
        const dist = await contract._LPRewardDistributor();
        let currBal;
        if (currencyIsEth) {
            currBal = await provider.getBalance(currentAddr);
        } else {
            const curr = new ethers.Contract(currencyAddress, ['function balanceOf(address) view returns (uint256)'], provider);
            currBal = await curr.balanceOf(currentAddr);
        }
        const tokenBal = await contract.balanceOf(dist);
        resultDiv.innerHTML = `
            💵 合约稳定币/ETH：<b>${ethers.utils.formatUnits(currBal, 18)}</b> ${currencyIsEth?'BNB':'USDT'}<br>
            🎁 分发器代币余额：<b>${ethers.utils.formatUnits(tokenBal, tokenDecimals)}</b> 代币
        `;
    } catch (e) {
        resultDiv.innerHTML = '❌ 查询失败：' + e.message;
    }
}
</script>
</body>
</html>
