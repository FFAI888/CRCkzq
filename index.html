<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>稳定机制一键诊断</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0a0e17; color: #e2e8f0; padding: 20px; max-width: 800px; margin: auto; }
    .card { background: #111827; border: 1px solid #1f2a3a; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    input, button { padding: 10px 16px; border-radius: 10px; border: 1px solid #1f2a3a; background: #1e293b; color: #e2e8f0; font-size: 1rem; }
    button { background: #3b82f6; cursor: pointer; border: none; }
    button:hover { filter: brightness(1.2); }
    .item { margin: 10px 0; padding: 10px; background: #0f172a; border-radius: 8px; }
    .good { color: #10b981; }
    .bad { color: #ef4444; }
    .warn { color: #f59e0b; }
  </style>
</head>
<body>
  <h1>🩺 PandaTokenV4 稳定机制诊断</h1>
  <div class="card">
    <input id="addr" type="text" placeholder="合约地址" style="width:100%" value="0xae1de305f8cdbcb94e1f2927c3c4825b5f43840c">
    <br><br>
    <button onclick="diagnose()">开始检查</button>
  </div>
  <div id="result" class="card"></div>

  <script>
    async function diagnose() {
      const addr = document.getElementById('addr').value.trim();
      if (!ethers.utils.isAddress(addr)) return alert('无效地址');
      const provider = new ethers.providers.JsonRpcProvider("https://bsc-dataseed.binance.org/");
      const abi = [
        "function totalBuyAmount() view returns (uint256)",
        "function totalSellAmount() view returns (uint256)",
        "function buyTriggerThreshold() view returns (uint256)",
        "function sellTriggerThreshold() view returns (uint256)",
        "function nextTriggerDirection() view returns (uint8)",
        "function enableAutoTrigger() view returns (bool)",
        "function cooldownRemaining() view returns (uint256)",
        "function triggerCooldown() view returns (uint256)",
        "function dailyTriggerCount() view returns (uint8)",
        "function maxDailyTriggers() view returns (uint8)",
        "function triggerActionPercent() view returns (uint256)",
        "function owner() view returns (address)"
      ];
      const contract = new ethers.Contract(addr, abi, provider);
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '<p>⏳ 读取中...</p>';
      try {
        const [
          totalBuy, totalSell, buyThres, sellThres, direction, enableAuto,
          coolRemain, coolLen, dailyCnt, maxDaily, actionPerc, owner
        ] = await Promise.all([
          contract.totalBuyAmount(), contract.totalSellAmount(),
          contract.buyTriggerThreshold(), contract.sellTriggerThreshold(),
          contract.nextTriggerDirection(), contract.enableAutoTrigger(),
          contract.cooldownRemaining(), contract.triggerCooldown(),
          contract.dailyTriggerCount(), contract.maxDailyTriggers(),
          contract.triggerActionPercent(), contract.owner()
        ]);

        const fmt = (val) => ethers.utils.formatUnits(val, 18);

        let html = `
          <div class="item"><strong>🔵 累计买入量 (totalBuyAmount)</strong>: ${fmt(totalBuy)} 代币</div>
          <div class="item"><strong>🔴 累计卖出量 (totalSellAmount)</strong>: ${fmt(totalSell)} 代币</div>
          <div class="item"><strong>🎯 买入阈值 (buyTriggerThreshold)</strong>: ${fmt(buyThres)} 代币</div>
          <div class="item"><strong>🎯 卖出阈值 (sellTriggerThreshold)</strong>: ${fmt(sellThres)} 代币</div>
          <div class="item"><strong>📈 执行百分比 (triggerActionPercent)</strong>: ${actionPerc} 基点 (${actionPerc/100}%)</div>
          <div class="item"><strong>🧭 当前方向 (nextTriggerDirection)</strong>: ${direction == 0 ? '买入→增发' : '卖出→转奖励池'}</div>
          <div class="item"><strong>✅ 自动触发开关</strong>: ${enableAuto ? '✅ 开启' : '❌ 关闭'}</div>
          <div class="item"><strong>⏳ 冷却剩余笔数</strong>: ${coolRemain} / 设定的冷却笔数: ${coolLen}</div>
          <div class="item"><strong>📅 今日已执行次数</strong>: ${dailyCnt} / 每日上限: ${maxDaily}</div>
          <hr>
          <h3>📋 诊断建议：</h3>
        `;

        // 问题检测
        let issues = [];
        if (buyThres.eq(0) && sellThres.eq(0)) {
          issues.push('<span class="bad">❌ 阈值未设置！请调用 setAutoTriggerParams 设置买入和卖出阈值（例如 100 代币）。</span>');
        }
        if (!enableAuto) {
          issues.push('<span class="bad">❌ 自动触发已关闭！请调用 setEnableAutoTrigger(true) 或使用面板开启。</span>');
        }
        if (direction == 1 && totalSell.eq(0)) {
          issues.push('<span class="warn">⚠️ 方向卡在 SELL，但无卖出累计，无法触发。建议调用 forceSwitchTriggerDirection 强制切换回 BUY。</span>');
        }
        if (coolRemain > 0) {
          issues.push(`<span class="warn">⏳ 冷却中：还需 ${coolRemain} 笔交易才能再次检查触发。</span>`);
        }
        if (dailyCnt >= maxDaily && maxDaily > 0) {
          issues.push(`<span class="bad">❌ 今日执行次数已达上限 (${maxDaily})。请等待 UTC 0 点重置。</span>`);
        }

        if (issues.length === 0) {
          if (direction == 0 && totalBuy.gte(buyThres)) {
            issues.push('<span class="good">✅ 状态正常，买入累计已达标，下次符合条件的交易将触发增发。</span>');
          } else if (direction == 1 && totalSell.gte(sellThres)) {
            issues.push('<span class="good">✅ 状态正常，卖出累计已达标，下次符合条件的交易将触发转奖励池。</span>');
          } else {
            issues.push('<span class="good">✅ 所有参数正常，但尚未达到触发阈值。继续交易即可。</span>');
          }
        }

        html += issues.join('<br>');
        resultDiv.innerHTML = html;
      } catch (e) {
        resultDiv.innerHTML = `<span class="bad">❌ 读取失败：${e.message}</span>`;
      }
    }
  </script>
</body>
</html>
