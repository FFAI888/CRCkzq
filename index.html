<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>稳定机制验证器 · 自动过滤事件</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body {
            background: #0a0e17; color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .card {
            background: #111827; border: 1px solid #1f2a3a;
            border-radius: 24px; padding: 30px; max-width: 680px; width: 100%;
        }
        h2 { color: #3b82f6; text-align: center; margin-bottom: 8px; }
        input, button {
            padding: 14px; border-radius: 14px; border: 1px solid #1f2a3a;
            background: #1e293b; color: #fff; font-size: 1rem; width: 100%;
            box-sizing: border-box; margin: 8px 0;
        }
        button {
            background: #3b82f6; font-weight: 600; cursor: pointer; border: none;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        button:hover { filter: brightness(1.2); transform: scale(1.01); }
        button.green { background: #10b981; }
        button.yellow { background: #f59e0b; color: #000; }
        .flex-row { display: flex; gap: 10px; }
        .flex-row button { flex: 1; }
        .result {
            background: #0f172a; border-radius: 14px; padding: 16px;
            margin-top: 15px; font-size: 0.95rem;
        }
        .tip {
            background: #1e293b; border-left: 4px solid #f59e0b;
            padding: 14px; margin: 15px 0; border-radius: 10px; font-size: 0.9rem;
        }
        hr { border-color: #1f2a3a; margin: 20px 0; }
        .code {
            background: #000; color: #10b981; padding: 6px 10px;
            border-radius: 6px; font-family: monospace; font-size: 0.85rem;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>🛡️ 稳定机制验证器</h2>
    <p style="text-align:center; color:#94a3b8;">100% 准确 · 无需 API · 自动过滤事件</p>

    <input type="text" id="contractAddress" placeholder="粘贴 PandaTokenV4 合约地址" />

    <div class="flex-row">
        <button onclick="loadContract()">📦 加载合约</button>
        <button onclick="autoLoad()" class="green">⚡ 加载上次地址</button>
    </div>
    <div id="status" style="text-align:center; margin:10px 0;"></div>

    <div id="actions" style="display:none;">
        <div class="flex-row">
            <button onclick="openSellEvents()" class="yellow">📤 一键查看卖出执行</button>
            <button onclick="openBuyEvents()" class="yellow">📥 一键查看回购执行</button>
        </div>
        <div class="tip">
            👆 点击上面按钮后，BscScan 页面会<strong>自动只显示该事件</strong>。<br>
            ✅ 如果出现交易记录 → 执行过<br>
            ❌ 如果显示“No matching events” → 从未触发
        </div>

        <button onclick="checkBalance()">💰 一键查询合约余额</button>
        <div id="balanceResult" class="result" style="display:none;"></div>
    </div>

    <hr>
    <div style="font-size:0.82rem; color:#94a3b8;">
        <b>📖 怎么看？</b><br>
        • 卖出执行后合约稳定币增加，回购执行后分发器代币增加<br>
        • 链上事件永久保存，无法伪造
    </div>
</div>

<script>
const RPC_URL = 'https://1rpc.io/bnb';
let provider = new ethers.providers.JsonRpcProvider(RPC_URL);
let contract = null;
let currentAddr = '';
let tokenDecimals = 18;
let currencyIsEth = false;
let currencyAddress = '';

const abi = [
    "function decimals() view returns (uint256)",
    "function currency() view returns (address)",
    "function currencyIsEth() view returns (bool)",
    "function balanceOf(address) view returns (uint256)",
    "function _LPRewardDistributor() view returns (address)",
    "event StabilizeSellExecuted(uint256 indexed tokensSold, uint256 indexed usdtReceived)",
    "event StabilizeBuyExecuted(uint256 indexed usdtSpent, uint256 indexed tokensBought)"
];

// 提前计算事件签名哈希 (topic0)
const SELL_TOPIC = ethers.utils.id('StabilizeSellExecuted(uint256,uint256)');
const BUY_TOPIC = ethers.utils.id('StabilizeBuyExecuted(uint256,uint256)');

function toWei(val, dec=18) { try { return ethers.utils.parseUnits(String(val), dec); } catch { return ethers.BigNumber.from(0); } }
function fromWei(val, dec=18) { try { return ethers.utils.formatUnits(val, dec); } catch { return String(val); } }

async function loadContract() {
    const addr = document.getElementById('contractAddress').value.trim();
    if (!ethers.utils.isAddress(addr)) return alert('地址无效');
    currentAddr = addr;
    localStorage.setItem('verify2_addr', addr);
    try {
        contract = new ethers.Contract(addr, abi, provider);
        const dec = await contract.decimals();
        tokenDecimals = Number(dec);
        currencyAddress = await contract.currency();
        currencyIsEth = await contract.currencyIsEth();
        document.getElementById('status').innerHTML = '<span style="color:#10b981;">✅ 合约已加载</span>';
        document.getElementById('actions').style.display = 'block';
    } catch (e) {
        document.getElementById('status').innerHTML = '<span style="color:#ef4444;">❌ 加载失败</span>';
    }
}

async function autoLoad() {
    const saved = localStorage.getItem('verify2_addr');
    if (saved) {
        document.getElementById('contractAddress').value = saved;
        await loadContract();
    } else {
        alert('没有保存的地址');
    }
}

// 打开 BscScan 事件页面，通过 #events 和 topic 参数自动过滤
function openSellEvents() {
    if (!currentAddr) return alert('请先加载合约');
    // BscScan 支持 ?topic0=xxx 参数直接过滤事件
    const url = `https://bscscan.com/address/${currentAddr}#events?topic0=${SELL_TOPIC}`;
    window.open(url, '_blank');
}

function openBuyEvents() {
    if (!currentAddr) return alert('请先加载合约');
    const url = `https://bscscan.com/address/${currentAddr}#events?topic0=${BUY_TOPIC}`;
    window.open(url, '_blank');
}

async function checkBalance() {
    if (!contract) return alert('请先加载合约');
    const resultDiv = document.getElementById('balanceResult');
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '⏳ 查询中...';
    try {
        const dist = await contract._LPRewardDistributor();
        let currBal;
        if (currencyIsEth) {
            currBal = await provider.getBalance(currentAddr);
        } else {
            const curr = new ethers.Contract(currencyAddress, ['function balanceOf(address) view returns (uint256)'], provider);
            currBal = await curr.balanceOf(currentAddr);
        }
        const tokenBal = await contract.balanceOf(dist);
        resultDiv.innerHTML = `
            💵 合约稳定币/ETH：<b>${ethers.utils.formatUnits(currBal, 18)}</b> ${currencyIsEth?'BNB':'USDT'}<br>
            🎁 分发器代币余额：<b>${ethers.utils.formatUnits(tokenBal, tokenDecimals)}</b> 代币
        `;
    } catch (e) {
        resultDiv.innerHTML = '❌ 查询失败：' + e.message;
    }
}
</script>
</body>
</html>
